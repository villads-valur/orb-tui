name: owlery

services:
  rabbitmq:
    image: rabbitmq:4-management-alpine
    ports:
      - "15672:15672"
    restart: unless-stopped

  courier:
    image: node:22-alpine
    command: ["node", "/app/fake-courier.js"]
    volumes:
      - ./fake-courier.js:/app/fake-courier.js:ro
    restart: unless-stopped
    depends_on: [rabbitmq]
