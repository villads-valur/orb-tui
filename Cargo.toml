[package]
name = "orb-tui"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A terminal UI for managing OrbStack (and other Docker) containers"
repository = "https://github.com/villads-valur/orb-tui"
license = "MIT"
readme = "README.md"
keywords = ["orbstack", "docker", "tui", "containers", "terminal"]
categories = ["command-line-utilities"]

[[bin]]
name = "orb-tui"
path = "src/main.rs"

[dependencies]
ratatui = "0.30"
crossterm = "0.29"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "2.0"
